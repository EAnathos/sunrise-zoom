name: Bug report
description: Report a reproducible issue with Sunrise Zoom.
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: sunrise-version
    attributes:
      label: Sunrise build
      placeholder: "Build/version"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Sunrise Zoom version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the key mode and relevant zoom settings.
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove private information before sharing.
    validations:
      required: false
